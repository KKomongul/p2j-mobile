name: p2j_mobile
description: "P들을 위한 TODO 공유 앱 P2J의 모바일 클라이언트."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 상태관리
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # 네트워크 / 라우팅
  dio: ^5.7.0
  go_router: ^14.6.0

  # 모델
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 토큰 저장
  flutter_secure_storage: ^9.2.2

  # flutter_localizations 가 intl 버전을 고정하므로 여기서는 따라간다.
  intl: any

  speech_to_text: ^7.4.0

  # 인증샷. 서명 URL 로 스토리지에 직접 올린다 (사진이 서버를 거치지 않는다).
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  custom_lint: ^0.8.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/mock/fixtures/
    - assets/images/
    # 2.0x / 3.0x / 4.0x 하위 폴더는 Flutter 가 화면 밀도에 맞춰 알아서 고른다.
    - assets/illustrations/

  fonts:
    # 가변 폰트 하나로 모든 굵기를 낸다. 정적 4종(11MB)보다 작다.
    # Flutter 는 가변 폰트에서 fontWeight 를 wght 축에 자동으로 이어주지 않으므로,
    # app_typography.dart 에서 fontVariations 로 축을 직접 지정한다.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
